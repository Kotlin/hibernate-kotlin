[versions]
kotlin = "2.3.0"
hibernate = "8.0.0-SNAPSHOT"
hibernate60 = "6.0.0.Final"
hibernate66 = "6.6.29.Final"
hibernate70 = "7.0.0.Final"
hibernate710 = "7.1.0.Final"
hibernate71 = "7.1.8.Final" # Spring Boot 4.0.0
hibernate720 = "7.2.0.Final"
hibernate730 = "7.3.0.Final"
hibernate740 = "7.4.0.Final"
hibernate74 = "7.4.1.Final" # Spring Boot 4.1.0
junit = "6.0.3"

[libraries]
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate" }
hibernate-community-dialects = { module = "org.hibernate.orm:hibernate-community-dialects", version.ref = "hibernate" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.2.0" }
h2 = { module = "com.h2database:h2", version = "2.4.240" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
